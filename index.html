                        <svg class="w-5 h-5 text-white dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>

    <script>
        // --- LOGIKA SPLASH SCREEN ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 700); 
            }, 7000); 
        });

        // --- DEKLARASI VARIABEL ---
        const selectKota = document.getElementById('kota');
        const jadwalContainer = document.getElementById('jadwal-container');
        const countdownContainer = document.getElementById('countdown-container');
        const statusPesan = document.getElementById('status-pesan');
        const toggleContainer = document.getElementById('toggle-container');
        let countdownInterval; 
        
        // --- LOGIKA SAKELAR (TOGGLE) ---
        const toggleCountdown = document.getElementById('toggle-countdown');
        let isCountdownEnabled = true;

        toggleCountdown.addEventListener('change', (e) => {
            isCountdownEnabled = e.target.checked;
            if (!isCountdownEnabled) {
                countdownContainer.classList.add('hidden'); 
            }
        });
        
        // --- LOGIKA TASBIH ---
        let angkaTasbih = 0;
        const layarTasbih = document.getElementById('tasbih-angka');
        const modalTasbih = document.getElementById('tasbih-modal');

        function bukaTasbih() { modalTasbih.classList.remove('hidden'); modalTasbih.classList.add('flex'); }
        function tutupTasbih() { modalTasbih.classList.add('hidden'); modalTasbih.classList.remove('flex'); }
        function updateLayarTasbih() { layarTasbih.textContent = String(angkaTasbih).padStart(4, '0'); }
        function tambahTasbih() {
            angkaTasbih++;
            if (angkaTasbih > 9999) angkaTasbih = 0; 
            updateLayarTasbih();
            if (navigator.vibrate) navigator.vibrate(30);
        }
        function resetTasbih() {
            if(confirm('Reset hitungan tasbih ke nol?')) {
                angkaTasbih = 0; updateLayarTasbih();
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            }
        }

        // --- DATA API & TANGGAL HIJRIAH ---
        const daftarKalsel = [
            "KAB. BALANGAN", "KAB. BANJAR", "KAB. BARITO KUALA", "KAB. HULU SUNGAI SELATAN", 
            "KAB. HULU SUNGAI TENGAH", "KAB. HULU SUNGAI UTARA", "KAB. KOTABARU", "KAB. TABALONG",
            "KAB. TANAH BUMBU", "KAB. TANAH LAUT", "KAB. TAPIN", "KOTA BANJARBARU", "KOTA BANJARMASIN"
        ];
        
        const isbatMasehi = new Date(2026, 1, 19); 
        const tahunHijriah = 1447;

        function konversiHijriahManual(sekarang) {
            const hariIni = new Date(sekarang.getFullYear(), sekarang.getMonth(), sekarang.getDate());
            isbatMasehi.setHours(0,0,0,0); hariIni.setHours(0,0,0,0);
            
            const selisihHari = Math.round((hariIni.getTime() - isbatMasehi.getTime()) / (1000 * 3600 * 24));
            
            if (selisihHari >= 30 && selisihHari <= 36) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            if (selisihHari >= 0 && selisihHari < 30) return `${selisihHari + 1} Ramadhan ${tahunHijriah} H`;
            if (selisihHari >= 30 && selisihHari < 60) return `${selisihHari - 30 + 1} Syawal ${tahunHijriah} H`;
            if (selisihHari < 0 && selisihHari >= -29) return `${29 + selisihHari + 1} Sya'ban ${tahunHijriah} H`;
            return `${tahunHijriah} H`;
        }

        function jalankanJamDanTanggal() {
            setInterval(() => {
                const sekarang = new Date();
                const jam = String(sekarang.getHours()).padStart(2, '0');
                const menit = String(sekarang.getMinutes()).padStart(2, '0');
                const detik = String(sekarang.getSeconds()).padStart(2, '0');
                
                document.getElementById('jam-realtime').textContent = `${jam}:${menit}:${detik}`;
                document.getElementById('tanggal-masehi').textContent = sekarang.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }, 1000);
            document.getElementById('tanggal-hijriah').textContent = konversiHijriahManual(new Date());
        }

        function mulaiHitungMundurSemuaWaktu(jadwal) {
            clearInterval(countdownInterval);
            
            const urutanShalat = [
                { nama: 'Imsak', waktu: jadwal.imsak }, { nama: 'Subuh', waktu: jadwal.subuh },
                { nama: 'Dzuhur', waktu: jadwal.dzuhur }, { nama: 'Ashar', waktu: jadwal.ashar },
                { nama: 'Maghrib', waktu: jadwal.maghrib }, { nama: 'Isya', waktu: jadwal.isya }
            ];

            countdownInterval = setInterval(() => {
                if (!isCountdownEnabled) return;

                const sekarang = new Date();
                let targetWaktu = null;

                for (let i = 0; i < urutanShalat.length; i++) {
                    const timeObj = new Date(sekarang.getTime());
                    const [jam, menit] = urutanShalat[i].waktu.split(':');
                    timeObj.setHours(jam, menit, 0, 0);

                    if (sekarang < timeObj) {
                        targetWaktu = { nama: urutanShalat[i].nama, waktuObj: timeObj };
                        break;
                    }
                }

                if (targetWaktu !== null) {
                    countdownContainer.classList.remove('hidden'); 
                    document.getElementById('countdown-label').textContent = `Menuju Waktu ${targetWaktu.nama}`;
                    
                    const selisih = targetWaktu.waktuObj - sekarang;
                    const jam = Math.floor((selisih % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const menit = Math.floor((selisih % (1000 * 60 * 60)) / (1000 * 60));
                    const detik = Math.floor((selisih % (1000 * 60)) / 1000);

                    const formatJam = String(jam).padStart(2, '0');
                    const formatMenit = String(menit).padStart(2, '0');
                    const formatDetik = String(detik).padStart(2, '0');
                    
                    document.getElementById('countdown-text').textContent = `${formatJam}:${formatMenit}:${formatDetik}`;
                } else {
                    countdownContainer.classList.remove('hidden');
                    document.getElementById('countdown-label').textContent = "Jadwal Hari Ini Selesai";
                    document.getElementById('countdown-text').textContent = "Alhamdulillah";
                }
            }, 1000);
        }

        function setStatus(pesan, isError = false) {
            statusPesan.textContent = pesan;
            statusPesan.className = isError ? "text-center font-bold mb-4 text-sm text-red-500" : "text-center font-bold mb-4 text-sm text-amber-600";
        }

        // --- MENGAMBIL DATA & MEMBACA MEMORI LOKAL (LOCAL STORAGE) ---
        async function fetchKotaKalsel() {
            try {
                const response = await fetch('https://api.myquran.com/v2/sholat/kota/semua');
                if (!response.ok) throw new Error("Gagal terhubung ke server");
                const data = await response.json();
                
                const kotaKalsel = data.data.filter(kota => daftarKalsel.includes(kota.lokasi)).sort((a, b) => a.lokasi.localeCompare(b.lokasi));
                selectKota.innerHTML = '<option value="">-- Pilih Kabupaten / Kota --</option>';
                kotaKalsel.forEach(kota => {
                    const option = document.createElement('option');
                    option.value = kota.id; 
                    option.textContent = kota.lokasi.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
                    selectKota.appendChild(option);
                });
                setStatus(""); 

                // CEK MEMORI LOKAL: Apakah pengguna pernah memilih kota sebelumnya?
                const kotaTersimpan = localStorage.getItem('pilihanKotaLPM');
                if (kotaTersimpan) {
                    selectKota.value = kotaTersimpan; // Otomatis setel dropdown ke kota tersebut
                    fetchJadwal(kotaTersimpan);       // Otomatis tarik jadwalnya
                }

            } catch (error) {
                setStatus("Gagal memuat daftar kota. Periksa internet Anda.", true);
                selectKota.innerHTML = '<option value="">Gagal memuat data</option>';
            }
        }

        async function fetchJadwal(idKota) {
            const sekarang = new Date();
            const year = sekarang.getFullYear();
            const month = String(sekarang.getMonth() + 1).padStart(2, '0');
            const day = String(sekarang.getDate()).padStart(2, '0');

            try {
                setStatus("Menyinkronkan jadwal...");
                jadwalContainer.classList.add('hidden');
                countdownContainer.classList.add('hidden');
                toggleContainer.classList.add('hidden');
                
                const response = await fetch(`https://api.myquran.com/v2/sholat/jadwal/${idKota}/${year}/${month}/${day}`);
                if (!response.ok) throw new Error("Gagal mengambil jadwal");
                const jadwal = (await response.json()).data.jadwal;

                document.getElementById('imsak').textContent = jadwal.imsak;
                document.getElementById('subuh').textContent = jadwal.subuh;
                document.getElementById('dzuhur').textContent = jadwal.dzuhur;
                document.getElementById('ashar').textContent = jadwal.ashar;
                document.getElementById('maghrib').textContent = jadwal.maghrib;
                document.getElementById('isya').textContent = jadwal.isya;

                setStatus(""); 
                jadwalContainer.classList.remove('hidden');
                toggleContainer.classList.remove('hidden'); 

                mulaiHitungMundurSemuaWaktu(jadwal);
            } catch (error) {
                setStatus("Gagal mengambil jadwal. Coba sesaat lagi.", true);
            }
        }

        selectKota.addEventListener('change', (e) => {
            const idKota = e.target.value;
            if (idKota) {
                // SIMPAN KE MEMORI LOKAL: Saat pengguna mengubah pilihan
                localStorage.setItem('pilihanKotaLPM', idKota);
                fetchJadwal(idKota);
            } else {
                localStorage.removeItem('pilihanKotaLPM'); // Hapus memori jika memilih opsi kosong
                jadwalContainer.classList.add('hidden');
                countdownContainer.classList.add('hidden');
                toggleContainer.classList.add('hidden');
                clearInterval(countdownInterval); 
            }
        });

        jalankanJamDanTanggal();
        fetchKotaKalsel();
        updateLayarTasbih(); 
    </script>
</body>
</html>
